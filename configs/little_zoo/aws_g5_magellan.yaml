lamorel_args:
  log_level: info
  allow_subgraph_use_whith_gradient: true
  distributed_setup_args:
    n_rl_processes: 1
    n_llm_processes: 1          # single A10G — no benefit splitting across procs
  accelerate_args:
    config_file: ./default_config.yaml
    machine_rank: 0
    main_process_ip: 127.0.0.1
    num_machines: 1
    main_process_port: 29501
  llm_args:
    seed:
    model_type: seq2seq
    model_path: google/flan-t5-base   # HF Hub — no /LLMs mount on EC2
    pretrained: true
    minibatch_size: 512          # A10G 24 GB; ~16-18 GB peak at gradient_batch_size 192
    pre_encode_inputs: true
    load_in_4bit: false          # 4-bit + explicit device_map crashes with transformers==4.44.2
    parallelism:
      use_gpu: true
      model_parallelism_size: 1
      synchronize_gpus_after_scoring: false
      empty_cuda_cache_after_scoring: false

rl_script_args:
  path: ???
  seed: ???

  # llm
  gradient_batch_size: 192      # 192×~10 actions ≈ 1920 gradient items → ~16-18 GB peak
  gradient_minibatch_size:

  # LoRA
  use_lora: true
  lora_r: 16
  lora_alpha: 32

  # SAC
  gamma: 0.99
  lr: 1e-4
  a_lr: 1e-3
  minibatch_size: 512
  update_freq: 64
  nb_updates: 1                 # paper standard; 2 would push VRAM at gradient_batch_size 192
  warmup_updates: 10
  buffer_size: 500000           # paper standard; comfortably fits in 16 GB RAM
  n_steps: 3
  alpha: auto

  # rl training
  number_envs: 64
  num_episodes: 500000          # full paper replication budget
  goal_sampler: magellan
  loading_path:
  adaptation_test: false

  # logs
  save_freq: 200                # frequent saves for Spot interruption safety
  test_freq: 5000               # paper standard; 1000 is too expensive at 500k episodes
  output_dir: ???

  # Environment
  env_name: LittleZoo
  goals_distribution: [20000, 4000, 800, 160, 32] #25k

# Goal sampler params
magellan_args:
  N: 100
  epsilon_start: 1.0
  epsilon_end: 0.2
  epsilon_decay: 320
  use_value: false
  buffer_size: 5000
  batch_size: 256
  recompute_freq: 32
  sr_adapters: sr_adapters
  train_llm: true
  delay_depth: 3                # paper standard (dev used 6 for LP investigation)
