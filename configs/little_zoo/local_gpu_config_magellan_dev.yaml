lamorel_args:
  log_level: info
  allow_subgraph_use_whith_gradient: true
  distributed_setup_args:
    n_rl_processes: 1
    n_llm_processes: 1          # single GPU — no benefit splitting LLM across two procs
  accelerate_args:
    config_file: ./default_config.yaml
    machine_rank: 0
    main_process_ip: 127.0.0.1
    num_machines: 1
    main_process_port: 29501
  llm_args:
    seed:                        # must be present (even if null) or lamorel raises ConfigAttributeError
    model_type: seq2seq
    model_path: google/flan-t5-base   # HF Hub id — works without a local /LLMs mount
    pretrained: true
    minibatch_size: 256          # 512 causes ~13 GB activation OOM on 16 GB VRAM
    pre_encode_inputs: true
    load_in_4bit: false          # 4-bit + explicit device_map crashes with transformers==4.44.2
    parallelism:
      use_gpu: true
      model_parallelism_size: 1
      synchronize_gpus_after_scoring: false
      empty_cuda_cache_after_scoring: false

rl_script_args:
  path: ???
  seed: ???

  # llm
  gradient_batch_size: 64       # 192 → ~1280 items with gradients → OOM; 64 peaks ~10 GB
  gradient_minibatch_size:

  # LoRA
  use_lora: true
  lora_r: 16
  lora_alpha: 32

  # SAC
  gamma: 0.99
  lr: 1e-4
  a_lr: 1e-3
  minibatch_size: 256
  update_freq: 64
  nb_updates: 2              # 2 gradient steps per cycle; same peak VRAM (graph freed between steps)
  warmup_updates: 5
  buffer_size: 250000           # 250k: ~16 update-cycle turnover at 40k episodes; balances diversity vs. RAM
  n_steps: 3
  alpha: auto

  # rl training
  number_envs: 64            # 2× envs → faster replay buffer fill; inference batches still chunked at minibatch_size
  num_episodes: 40000           # ~10h; long enough to observe grow_herbivores learning progress
  goal_sampler: magellan
  loading_path:
  adaptation_test: false

  # logs
  save_freq: 200
  test_freq: 1000
  output_dir: ???

  # Environment
  env_name: LittleZoo
  goals_distribution: [20000, 4000, 800, 160, 32] #25k

# Goal sampler params
magellan_args:
  N: 100
  epsilon_start: 1.0
  epsilon_end: 0.2
  epsilon_decay: 320
  use_value: false
  buffer_size: 5000
  batch_size: 256
  recompute_freq: 32
  sr_adapters: sr_adapters
  train_llm: true
  delay_depth: 6
