services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - ./outputs:/app/outputs
    command: >
      mlflow server --host 0.0.0.0
      --backend-store-uri sqlite:////app/outputs/mlflow.db
      --artifacts-destination /app/outputs/mlflow-artifacts
      --no-serve-artifacts
      --allowed-hosts "mlflow,mlflow:*,localhost,localhost:*"

  magellan:
    build:
      context: .
      secrets:
        - ssh_key
    image: magellan:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Set your HuggingFace token if using gated models
      # - HF_TOKEN=...
    volumes:
      # Persist training outputs
      - ./outputs:/app/outputs
      # Cache model weights across runs (avoids re-downloading)
      - hf_cache:/app/.cache/huggingface
    depends_on:
      - mlflow
    command: >
      python -m lamorel_launcher.launch
      --config-path /app/configs/little_zoo/
      --config-name ${CONFIG_NAME:-local_gpu_config_magellan_dev}
      rl_script_args.path=/app/magellan/main.py
      rl_script_args.output_dir=/app/outputs/${OUTPUT_DIR:-magellan}
      rl_script_args.seed=${SEED:-0}

volumes:
  hf_cache:

secrets:
  ssh_key:
    file: ~/.ssh/id_ed25519
